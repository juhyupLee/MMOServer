html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;mmo-server-thread-architecture&quot;&gt;
  &lt;style&gt;
    #mmo-server-thread-architecture {
      color: var(--foreground);
      display: grid;
      gap: 1rem;
      min-width: 0;
    }

    #mmo-server-thread-architecture .mode-detail {
      margin: 0;
      min-height: 1.5em;
      color: var(--muted-foreground);
    }

    #mmo-server-thread-architecture .view[hidden] {
      display: none;
    }

    #mmo-server-thread-architecture .architecture {
      display: grid;
      gap: 0.75rem;
    }

    #mmo-server-thread-architecture .control-band {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.4fr);
      align-items: center;
      gap: 0.5rem;
    }

    #mmo-server-thread-architecture .system-flow {
      display: grid;
      grid-template-columns: minmax(0, 0.8fr) auto minmax(0, 1.2fr) auto minmax(0, 1.35fr) auto minmax(0, 1.15fr);
      align-items: stretch;
      gap: 0.4rem;
    }

    #mmo-server-thread-architecture .runtime-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem;
    }

    #mmo-server-thread-architecture .diagram-node {
      min-width: 0;
      padding: 0.7rem;
      border: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
      border-radius: 0.55rem;
      background: color-mix(in srgb, var(--node-color, var(--muted)) 10%, transparent);
    }

    #mmo-server-thread-architecture .diagram-node strong,
    #mmo-server-thread-architecture .diagram-node span {
      display: block;
    }

    #mmo-server-thread-architecture .diagram-node span + span {
      margin-top: 0.25rem;
    }

    #mmo-server-thread-architecture .owner-control {
      --node-color: var(--viz-series-1);
    }

    #mmo-server-thread-architecture .owner-io {
      --node-color: var(--viz-series-2);
    }

    #mmo-server-thread-architecture .owner-strand {
      --node-color: var(--viz-series-3);
    }

    #mmo-server-thread-architecture .owner-logic {
      --node-color: var(--viz-series-4);
    }

    #mmo-server-thread-architecture .owner-safety {
      --node-color: var(--viz-series-5);
    }

    #mmo-server-thread-architecture .arrow {
      align-self: center;
      color: var(--muted-foreground);
      text-align: center;
    }

    #mmo-server-thread-architecture .arrow span {
      display: block;
    }

    #mmo-server-thread-architecture .ownership {
      display: grid;
      gap: 0.35rem;
    }

    #mmo-server-thread-architecture .ownership-row {
      display: grid;
      grid-template-columns: minmax(8rem, 0.8fr) minmax(0, 2fr);
      gap: 0.75rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
    }

    #mmo-server-thread-architecture .ownership-row:last-child {
      border-bottom: 0;
    }

    #mmo-server-thread-architecture .owner-label {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    #mmo-server-thread-architecture .owner-mark {
      width: 0.75rem;
      height: 0.75rem;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--node-color);
    }

    #mmo-server-thread-architecture .flow-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
      gap: 0.6rem;
      counter-reset: flow-step;
    }

    #mmo-server-thread-architecture .flow-step {
      counter-increment: flow-step;
      position: relative;
      min-width: 0;
      padding: 0.75rem;
      border-top: 3px solid var(--node-color, var(--border));
      background: color-mix(in srgb, var(--node-color, var(--muted)) 8%, transparent);
    }

    #mmo-server-thread-architecture .flow-step::before {
      content: counter(flow-step);
      display: inline-grid;
      place-items: center;
      width: 1.6rem;
      height: 1.6rem;
      margin-bottom: 0.45rem;
      border-radius: 50%;
      background: color-mix(in srgb, var(--node-color, var(--muted)) 24%, transparent);
      color: var(--foreground);
    }

    #mmo-server-thread-architecture .flow-step strong,
    #mmo-server-thread-architecture .flow-step span {
      display: block;
    }

    #mmo-server-thread-architecture .flow-step span {
      margin-top: 0.25rem;
    }

    #mmo-server-thread-architecture .timeline {
      display: grid;
      gap: 0;
    }

    #mmo-server-thread-architecture .timeline-step {
      display: grid;
      grid-template-columns: 2rem minmax(0, 1fr);
      gap: 0.65rem;
      position: relative;
      padding-bottom: 0.8rem;
    }

    #mmo-server-thread-architecture .timeline-step:not(:last-child)::after {
      content: &quot;&quot;;
      position: absolute;
      left: 0.95rem;
      top: 1.8rem;
      bottom: 0;
      width: 1px;
      background: var(--border);
    }

    #mmo-server-thread-architecture .timeline-index {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background: color-mix(in srgb, var(--node-color, var(--muted)) 20%, transparent);
    }

    #mmo-server-thread-architecture .timeline-copy {
      min-width: 0;
      padding-top: 0.2rem;
    }

    #mmo-server-thread-architecture .timeline-copy strong,
    #mmo-server-thread-architecture .timeline-copy span {
      display: block;
    }

    #mmo-server-thread-architecture .timeline-copy span {
      margin-top: 0.2rem;
    }

    #mmo-server-thread-architecture code {
      overflow-wrap: anywhere;
    }

    @media (max-width: 650px) {
      #mmo-server-thread-architecture .control-band,
      #mmo-server-thread-architecture .system-flow,
      #mmo-server-thread-architecture .runtime-summary {
        grid-template-columns: minmax(0, 1fr);
      }

      #mmo-server-thread-architecture .arrow {
        transform: none;
      }

      #mmo-server-thread-architecture .arrow &gt; span:first-child {
        display: none;
      }

      #mmo-server-thread-architecture .arrow::before {
        content: &quot;↓&quot;;
        display: block;
      }

      #mmo-server-thread-architecture .ownership-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 0.25rem;
      }
    }
  &lt;/style&gt;

  &lt;div class=&quot;viz-controls&quot; role=&quot;group&quot; aria-label=&quot;표시할 서버 흐름 선택&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-mode=&quot;overview&quot; aria-pressed=&quot;true&quot;&gt;전체 구조&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-mode=&quot;receive&quot; aria-pressed=&quot;false&quot;&gt;수신 경로&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-mode=&quot;send&quot; aria-pressed=&quot;false&quot;&gt;송신 경로&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-mode=&quot;shutdown&quot; aria-pressed=&quot;false&quot;&gt;종료 순서&lt;/button&gt;
  &lt;/div&gt;

  &lt;p class=&quot;mode-detail text-small&quot; aria-live=&quot;polite&quot;&gt;PlayServer는 보통 7 threads이며, I/O·세션 상태·게임 로직 책임을 분리한다.&lt;/p&gt;

  &lt;section class=&quot;view architecture&quot; data-view=&quot;overview&quot; aria-label=&quot;MMO 서버 런타임 스레드 구조&quot;&gt;
    &lt;div class=&quot;control-band&quot;&gt;
      &lt;div class=&quot;diagram-node owner-control&quot;&gt;
        &lt;strong&gt;Main / control thread&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;Initialize → Listen → Run&lt;/code&gt;&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;현재 &lt;code&gt;Run()&lt;/code&gt;은 5초 통계 loop에서 종료되지 않음&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;arrow&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;→&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;diagram-node owner-safety&quot;&gt;
        &lt;strong&gt;NetworkServer lifecycle&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;lifecycle lock · session map mutex · 최대 4,096 sessions&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;system-flow&quot; role=&quot;img&quot; aria-label=&quot;클라이언트에서 Asio I/O worker, 세션 strand, JobDispatcher logic thread로 이어지는 구조&quot;&gt;
      &lt;div class=&quot;diagram-node&quot;&gt;
        &lt;strong&gt;TCP clients&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;Play client / DummyClient bots&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;arrow&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;text-small&quot;&gt;TCP&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;diagram-node owner-io&quot;&gt;
        &lt;strong&gt;Boost.Asio &lt;code&gt;io_context&lt;/code&gt;&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;Windows IOCP / Linux epoll&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;I/O jthreads: 기본 &lt;code&gt;clamp(hw, 1, 4)&lt;/code&gt;&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;accept · resolve · connect · read · write&lt;/code&gt;&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;arrow&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;text-small&quot;&gt;post&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;diagram-node owner-strand&quot;&gt;
        &lt;strong&gt;NetworkSession strand&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;세션별 콜백 비동시 실행&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;Recv: RingQ 7,000B + FrameDecoder&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;Send: bounded deque + 256KiB 예약&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;arrow&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;→&lt;/span&gt;&lt;span class=&quot;text-small&quot;&gt;job&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;diagram-node owner-logic&quot;&gt;
        &lt;strong&gt;JobDispatcher logic jthread&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;세션별 JobQueue · 기본 최대 256 jobs&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;active queue + condition_variable&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;PlayServer main dispatcher: 1 thread&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;sub dispatcher: 1 thread · 현재 미사용&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;runtime-summary&quot; aria-label=&quot;PlayServer 실제 기본 스레드 수와 비용 주의점&quot;&gt;
      &lt;div class=&quot;diagram-node owner-control&quot;&gt;
        &lt;strong&gt;4코어 이상에서 보통 7 threads&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;main 1 + Asio 4 + main dispatcher 1 + unused sub dispatcher 1&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;diagram-node owner-safety&quot;&gt;
        &lt;strong&gt;현재 비용 주의&lt;/strong&gt;
        &lt;span class=&quot;text-small text-destructive&quot;&gt;&lt;code&gt;JobDispatcher(..., 1)&lt;/code&gt;의 1은 thread 수가 아니라 1µs timeout&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;main/sub 둘 다 빈 queue에서도 짧은 &lt;code&gt;wait_for&lt;/code&gt;를 반복하며, sub는 사용되지 않음&lt;/span&gt;
        &lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;timeout=0&lt;/code&gt;이면 condition_variable notify까지 대기&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;ownership&quot; aria-label=&quot;스레드별 소유 상태&quot;&gt;
      &lt;div class=&quot;ownership-row&quot;&gt;
        &lt;div class=&quot;owner-label owner-control&quot;&gt;&lt;span class=&quot;owner-mark&quot;&gt;&lt;/span&gt;&lt;strong&gt;Control thread&lt;/strong&gt;&lt;/div&gt;
        &lt;span class=&quot;text-small&quot;&gt;서버 시작·리스닝·종료를 조정하며, &lt;code&gt;Shutdown()&lt;/code&gt;은 I/O worker에서 호출하지 않는다.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ownership-row&quot;&gt;
        &lt;div class=&quot;owner-label owner-io&quot;&gt;&lt;span class=&quot;owner-mark&quot;&gt;&lt;/span&gt;&lt;strong&gt;Asio I/O workers&lt;/strong&gt;&lt;/div&gt;
        &lt;span class=&quot;text-small&quot;&gt;준비된 비동기 completion을 실행한다. 여러 worker가 있어도 같은 세션 상태에는 strand를 통해 진입한다.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ownership-row&quot;&gt;
        &lt;div class=&quot;owner-label owner-strand&quot;&gt;&lt;span class=&quot;owner-mark&quot;&gt;&lt;/span&gt;&lt;strong&gt;Session strand&lt;/strong&gt;&lt;/div&gt;
        &lt;span class=&quot;text-small&quot;&gt;socket, RingQ, send deque, &lt;code&gt;m_closeStarted&lt;/code&gt;를 직렬 소유한다.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ownership-row&quot;&gt;
        &lt;div class=&quot;owner-label owner-logic&quot;&gt;&lt;span class=&quot;owner-mark&quot;&gt;&lt;/span&gt;&lt;strong&gt;Logic jthread&lt;/strong&gt;&lt;/div&gt;
        &lt;span class=&quot;text-small&quot;&gt;FlatBuffers native message를 게임 핸들러로 전달한다. 현재 main 1개가 모든 세션을 처리하고 sub 1개는 미사용 상태로 1µs polling한다.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;ownership-row&quot;&gt;
        &lt;div class=&quot;owner-label owner-safety&quot;&gt;&lt;span class=&quot;owner-mark&quot;&gt;&lt;/span&gt;&lt;strong&gt;Send callers&lt;/strong&gt;&lt;/div&gt;
        &lt;span class=&quot;text-small&quot;&gt;직렬화·암호화 후 admission mutex로 bytes를 먼저 예약한다. 동시 호출은 안전하지만 의미적 호출 순서는 별도 보장하지 않는다.&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;view&quot; data-view=&quot;receive&quot; aria-label=&quot;패킷 수신 처리 흐름&quot; hidden&gt;
    &lt;div class=&quot;flow-steps&quot;&gt;
      &lt;div class=&quot;flow-step owner-io&quot;&gt;
        &lt;strong&gt;TCP bytes 도착&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;OS backend가 socket readiness/completion을 전달&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-io&quot;&gt;
        &lt;strong&gt;&lt;code&gt;async_read_some&lt;/code&gt;&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;I/O worker가 completion handler 실행&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-strand&quot;&gt;
        &lt;strong&gt;세션 strand 진입&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;같은 세션의 read/write/close 상태를 직렬화&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-strand&quot;&gt;
        &lt;strong&gt;RingQ에 commit&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;wrap 시 최대 두 writable segment 사용&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-strand&quot;&gt;
        &lt;strong&gt;FrameDecoder&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;4B header를 Peek; 부족하면 대기, 완성되면 전체 Dequeue&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-strand&quot;&gt;
        &lt;strong&gt;검증·변환&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;XOR Convert → FlatBuffers Verifier → UnPack&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-safety&quot;&gt;
        &lt;strong&gt;JobQueue admission&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;세션당 기본 256 outstanding jobs 초과 시 disconnect&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-logic&quot;&gt;
        &lt;strong&gt;게임 핸들러 실행&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;Logic jthread가 active queue를 pop하여 순차 처리&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;view&quot; data-view=&quot;send&quot; aria-label=&quot;패킷 송신 처리 흐름&quot; hidden&gt;
    &lt;div class=&quot;flow-steps&quot;&gt;
      &lt;div class=&quot;flow-step owner-logic&quot;&gt;
        &lt;strong&gt;&lt;code&gt;NetworkSession::Send&lt;/code&gt;&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;게임 로직 또는 다른 caller thread에서 호출&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-safety&quot;&gt;
        &lt;strong&gt;직렬화·암호화&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;FlatBuffer size-prefix 생성 후 body에 Convert 적용&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-safety&quot;&gt;
        &lt;strong&gt;pre-post bytes 예약&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;admission mutex에서 256KiB 한도를 먼저 검사&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-strand&quot;&gt;
        &lt;strong&gt;strand에 &lt;code&gt;post&lt;/code&gt;&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;Shutdown 이후 새 packet이 남지 않도록 close gate와 직렬화&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-strand&quot;&gt;
        &lt;strong&gt;bounded send deque&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;&lt;code&gt;shared_ptr&amp;lt;NetworkPacket&amp;gt;&lt;/code&gt;으로 buffer lifetime 보장&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-io&quot;&gt;
        &lt;strong&gt;&lt;code&gt;async_write&lt;/code&gt;&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;한 세션에서 동시에 하나의 full-frame write만 진행&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-strand&quot;&gt;
        &lt;strong&gt;completion&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;front pop · pending bytes 감소 · 다음 packet 시작&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-step owner-safety&quot;&gt;
        &lt;strong&gt;slow-client 차단&lt;/strong&gt;
        &lt;span class=&quot;text-small&quot;&gt;한도 초과 또는 post 실패 시 send gate를 닫고 session 제거&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;view&quot; data-view=&quot;shutdown&quot; aria-label=&quot;안전한 서버 종료 순서&quot; hidden&gt;
    &lt;div class=&quot;timeline&quot;&gt;
      &lt;div class=&quot;timeline-step owner-control&quot;&gt;
        &lt;div class=&quot;timeline-index&quot;&gt;1&lt;/div&gt;
        &lt;div class=&quot;timeline-copy&quot;&gt;&lt;strong&gt;Control thread에서 lifecycle 독점&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;I/O worker가 직접 호출하면 self-join을 피하기 위해 거부한다. PlayServer에는 아직 무한 &lt;code&gt;Run()&lt;/code&gt;을 끝낼 정상 종료 trigger가 필요하다.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;timeline-step owner-safety&quot;&gt;
        &lt;div class=&quot;timeline-index&quot;&gt;2&lt;/div&gt;
        &lt;div class=&quot;timeline-copy&quot;&gt;&lt;strong&gt;&lt;code&gt;m_initialized = false&lt;/code&gt;&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;새 Listen, Connect, session admission을 즉시 차단한다.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;timeline-step owner-io&quot;&gt;
        &lt;div class=&quot;timeline-index&quot;&gt;3&lt;/div&gt;
        &lt;div class=&quot;timeline-copy&quot;&gt;&lt;strong&gt;acceptor cancel / close 게시&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;accept 실패 재시도 timer도 initialized gate에서 멈춘다.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;timeline-step owner-safety&quot;&gt;
        &lt;div class=&quot;timeline-index&quot;&gt;4&lt;/div&gt;
        &lt;div class=&quot;timeline-copy&quot;&gt;&lt;strong&gt;session map snapshot 후 clear&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;map mutex 안에서 상태를 비운 뒤, lock 밖에서 각 session을 닫는다.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;timeline-step owner-strand&quot;&gt;
        &lt;div class=&quot;timeline-index&quot;&gt;5&lt;/div&gt;
        &lt;div class=&quot;timeline-copy&quot;&gt;&lt;strong&gt;각 strand에서 &lt;code&gt;CloseInternal&lt;/code&gt;&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;send admission 차단 · resolver/socket cancel · queues와 RingQ 정리.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;timeline-step owner-io&quot;&gt;
        &lt;div class=&quot;timeline-index&quot;&gt;6&lt;/div&gt;
        &lt;div class=&quot;timeline-copy&quot;&gt;&lt;strong&gt;late completion drain&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;close 뒤 도착한 resolve/connect/read/write handler는 &lt;code&gt;m_closeStarted&lt;/code&gt;에서 즉시 종료한다.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;timeline-step owner-control&quot;&gt;
        &lt;div class=&quot;timeline-index&quot;&gt;7&lt;/div&gt;
        &lt;div class=&quot;timeline-copy&quot;&gt;&lt;strong&gt;work guard reset 후 I/O jthreads join&lt;/strong&gt;&lt;span class=&quot;text-small&quot;&gt;NetworkServer 종료가 완료된 다음 JobDispatcher를 파괴하며 lifetime handle을 null 처리한다.&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;sr-only&quot;&gt;
    서버는 control thread, 기본 1~4개의 Boost.Asio I/O worker, 세션별 strand, JobDispatcher logic thread로 구성된다. 수신 데이터는 RingQ와 FrameDecoder를 거쳐 세션 JobQueue로 이동하고, 송신 데이터는 사전 바이트 예약 후 strand의 bounded deque에서 하나씩 async_write 된다.
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;mmo-server-thread-architecture&quot;);
      if (root == null) return;

      const details = {
        overview: &quot;PlayServer는 보통 7 threads이며, I/O·세션 상태·게임 로직 책임을 분리한다.&quot;,
        receive: &quot;수신 frame은 세션 strand에서 완성·검증된 뒤 bounded JobQueue를 통해 logic thread로 넘어간다.&quot;,
        send: &quot;송신 memory는 strand에 post하기 전에 예약하므로 느린 client가 I/O queue 바깥에 packet을 무한 적재할 수 없다.&quot;,
        shutdown: &quot;종료는 새 작업 차단 → 자원 cancel → completion drain → worker join 순서로 진행한다.&quot;
      };

      const detail = root.querySelector(&quot;.mode-detail&quot;);
      const buttons = Array.from(root.querySelectorAll(&quot;button[data-mode]&quot;));
      const views = Array.from(root.querySelectorAll(&quot;[data-view]&quot;));

      const selectMode = (mode) =&gt; {
        buttons.forEach((button) =&gt; {
          const selected = button.dataset.mode === mode;
          button.setAttribute(&quot;aria-pressed&quot;, String(selected));
          button.classList.toggle(&quot;btn-primary&quot;, selected);
        });
        views.forEach((view) =&gt; {
          view.hidden = view.dataset.view !== mode;
        });
        if (detail != null) detail.textContent = details[mode] ?? details.overview;
      };

      buttons.forEach((button) =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; selectMode(button.dataset.mode ?? &quot;overview&quot;));
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
