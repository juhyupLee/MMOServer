name: mmoserver-soak

x-runtime: &runtime
  image: mmoserver-soak:${RUN_ID:-local}
  init: true
  restart: "no"
  environment:
    MALLOC_ARENA_MAX: "2"
  volumes:
    - ${ARTIFACT_DIR:-./artifacts}:/artifacts
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
    core:
      soft: -1
      hard: -1

services:
  server:
    <<: *runtime
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - ./bin/PlayServer
      - --port
      - "7777"
      - --io-threads
      - ${SERVER_IO_THREADS:-4}
      - --max-sessions
      - ${SERVER_MAX_SESSIONS:-4096}
      - --metrics-interval-sec
      - ${METRICS_INTERVAL_SEC:-5}
      - --metrics-file
      - ${SERVER_METRICS_FILE:-/artifacts/server.csv}
      - --run-id
      - ${RUN_ID:-local}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x PlayServer >/dev/null"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 1s
    stop_signal: SIGTERM
    stop_grace_period: 30s

  loadbot:
    <<: *runtime
    depends_on:
      server:
        condition: service_healthy
    command:
      - bash
      - -lc
      - >-
        ./scripts/wait_for_port.sh server 7777 60 &&
        exec ./bin/SoakClient
        --host server --port 7777
        --bots ${BOT_COUNT:-1000}
        --bot-id-base ${BOT_ID_BASE:-0}
        --duration-sec ${DURATION_SEC:-86400}
        --ramp-up-sec ${RAMP_UP_SEC:-60}
        --pps ${PPS_PER_BOT:-5}
        --reconnect-percent ${RECONNECT_PERCENT:-5}
        --reconnect-interval-sec ${RECONNECT_INTERVAL_SEC:-60}
        --reconnect-delay-ms ${RECONNECT_DELAY_MS:-1000}
        --payload-sizes ${PAYLOAD_SIZES:-1,32,128,512,1024,4096,6400}
        --metrics-interval-sec ${METRICS_INTERVAL_SEC:-5}
        --metrics-file /artifacts/client-$${HOSTNAME}.csv
        --run-id ${RUN_ID:-local}
        --seed ${SOAK_SEED:-20260712}
        --probe-pass-count ${PROBE_PASS_COUNT:-0}
    stop_signal: SIGTERM
    stop_grace_period: 30s

  protocol-probe:
    <<: *runtime
    profiles: ["preflight"]
    depends_on:
      server:
        condition: service_healthy
    command:
      - bash
      - -lc
      - >-
        ./scripts/wait_for_port.sh server 7777 60 &&
        exec ./bin/ProtocolProbe --host server --port 7777
        --timeout-ms 3000 --frame-timeout-wait-ms 12000
